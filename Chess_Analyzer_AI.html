<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board Setup & Endgame Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; user-select: none; background-color: #f3f4f6; color: #1f2937; }
        
        /* Board colors matching image exact steel-blue aesthetic */
        .sq-light { background-color: #ffffff; }
        .sq-dark { background-color: #6888ac; }
        .sq-selected { background-color: #baca44 !important; }
        .sq-drag-over { outline: 3px solid #10b981; outline-offset: -3px; background-color: rgba(16, 185, 129, 0.25) !important; }
        
        .legal-dot {
            width: 26%;
            height: 26%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.22);
            pointer-events: none;
        }
        .legal-capture {
            width: 88%;
            height: 88%;
            border-radius: 50%;
            border: 4px solid rgba(0, 0, 0, 0.22);
            pointer-events: none;
        }
        .piece-svg {
            cursor: grab;
            transition: transform 0.05s ease-in-out;
            filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.25));
            touch-action: none;
        }
        .piece-svg:active { cursor: grabbing; transform: scale(1.08); }
        
        .palette-btn {
            border: 1px solid #d1d5db;
            background-color: #f9fafb;
            transition: all 0.15s ease;
            cursor: pointer;
            border-radius: 6px;
        }
        .palette-btn:hover {
            background-color: #f3f4f6;
        }
        .palette-btn.active {
            border-color: #10b981 !important;
            background-color: #d1fae5 !important;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
        }

        .btn-green-main {
            background-color: #059669;
            color: #ffffff;
            transition: all 0.15s ease;
        }
        .btn-green-main:hover {
            background-color: #047857;
        }
        .btn-green-active {
            background-color: #047857 !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100">

    <!-- Header Controls matching Screenshot Top Bar -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-chess-king text-2xl text-emerald-500"></i>
                <div>
                    <h1 class="text-base font-bold tracking-tight">Chess Endgame Setup & AI Engine</h1>
                    <p class="text-xs text-slate-400">Position Analysis & Scalable Computer Engine</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <button id="btn-import-fen" class="btn-green-main px-3.5 py-1.5 rounded-md font-semibold text-xs md:text-sm flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-right-to-bracket"></i> Import FEN
                </button>
                <button id="btn-mode-setup" class="btn-green-main btn-green-active px-3.5 py-1.5 rounded-md font-semibold text-xs md:text-sm flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-border-all"></i> Analysis Board
                </button>
                <button id="btn-mode-play" class="btn-green-main px-3.5 py-1.5 rounded-md font-semibold text-xs md:text-sm flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-robot"></i> Play vs Computer
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Status Notification Banner -->
        <div id="status-banner" class="mb-4 p-3 rounded-lg border text-xs md:text-sm font-semibold flex items-center justify-between transition-all duration-200 bg-white border-slate-300 text-slate-800 shadow-sm">
            <div class="flex items-center gap-2.5">
                <span id="status-indicator" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span id="status-text">Analysis Mode: Drag or click pieces from the palette onto any square.</span>
            </div>
            <span id="engine-loader" class="hidden flex items-center gap-2 text-xs font-medium text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-300">
                <i class="fa-solid fa-spinner fa-spin"></i> Engine thinking...
            </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
            
            <!-- Left Column: Chess Board & Action Toolbar -->
            <div class="md:col-span-7 flex flex-col items-center">
                <!-- Board Frame with subtle border -->
                <div class="w-full max-w-[500px] aspect-square relative shadow-xl rounded-md overflow-hidden border-2 border-slate-700 bg-slate-800 select-none">
                    <div id="chessboard" class="grid grid-cols-8 grid-rows-8 w-full h-full">
                        <!-- Squares generated dynamically -->
                    </div>

                    <!-- Pawn Promotion Choice Dialog -->
                    <div id="promotion-modal" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center z-50">
                        <div class="bg-white border border-slate-300 p-4 rounded-xl shadow-2xl text-center max-w-xs w-full">
                            <p class="font-bold mb-3 text-slate-800 text-xs uppercase tracking-wider">Choose Promotion</p>
                            <div id="promotion-options" class="flex justify-center gap-2"></div>
                        </div>
                    </div>
                </div>

                <!-- Bottom Control Buttons matching Screenshot -->
                <div class="w-full max-w-[500px] flex justify-center gap-3 mt-3">
                    <button id="btn-flip" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold px-4 py-1.5 rounded-md text-xs flex items-center gap-1.5 shadow-xs transition">
                        <i class="fa-solid fa-rotate text-slate-500"></i> Flip
                    </button>
                    <button id="btn-clear" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold px-4 py-1.5 rounded-md text-xs flex items-center gap-1.5 shadow-xs transition">
                        <i class="fa-solid fa-eraser text-slate-500"></i> Clear
                    </button>
                    <button id="btn-reset" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold px-4 py-1.5 rounded-md text-xs flex items-center gap-1.5 shadow-xs transition">
                        <i class="fa-solid fa-rotate-left text-slate-500"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Right Column: Setup Palette & Play Settings -->
            <div class="md:col-span-5 flex flex-col gap-4 w-full">

                <!-- Setup Mode Panel matching screenshot grid -->
                <div id="panel-setup" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    
                    <!-- Palette Grid -->
                    <div>
                        <div class="grid grid-cols-7 gap-1.5 max-w-[340px]">
                            <!-- Row 1: Hand tool + Black pieces -->
                            <button class="palette-btn active h-11 flex items-center justify-center text-emerald-600" data-tool="select" title="Move / Drag Tool">
                                <i class="fa-solid fa-hand text-base"></i>
                            </button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="k" title="Black King" id="pal-k"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="q" title="Black Queen" id="pal-q"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="r" title="Black Rook" id="pal-r"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="b" title="Black Bishop" id="pal-b"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="n" title="Black Knight" id="pal-n"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="p" title="Black Pawn" id="pal-p"></button>

                            <!-- Row 2: Trash tool + White pieces -->
                            <button id="trash-zone" class="palette-btn h-11 flex items-center justify-center text-slate-400 hover:text-red-500" data-tool="trash" title="Delete Piece Tool / Drop to Delete">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="K" title="White King" id="pal-K"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="Q" title="White Queen" id="pal-Q"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="R" title="White Rook" id="pal-R"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="B" title="White Bishop" id="pal-B"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="N" title="White Knight" id="pal-N"></button>
                            <button class="palette-btn h-11 p-1 flex items-center justify-center" data-piece="P" title="White Pawn" id="pal-P"></button>
                        </div>
                    </div>

                    <!-- Side to move dropdown -->
                    <div>
                        <select id="turn-select" class="w-full bg-white border border-emerald-500 rounded-md p-2 text-xs md:text-sm font-medium text-slate-800 focus:outline-none focus:ring-1 focus:ring-emerald-500">
                            <option value="w">White to move</option>
                            <option value="b">Black to move</option>
                        </select>
                    </div>

                    <!-- Castling options matching screenshot -->
                    <div>
                        <span class="block text-xs font-semibold text-slate-700 mb-1.5">Castling</span>
                        <div class="space-y-1.5 text-xs">
                            <div class="flex items-center gap-4 text-slate-600">
                                <span class="w-10 font-medium text-slate-500">White</span>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-slate-900"><input type="checkbox" id="castling-wk" checked class="accent-emerald-600 rounded"> O-O</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-slate-900"><input type="checkbox" id="castling-wq" checked class="accent-emerald-600 rounded"> O-O-O</label>
                            </div>
                            <div class="flex items-center gap-4 text-slate-600">
                                <span class="w-10 font-medium text-slate-500">Black</span>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-slate-900"><input type="checkbox" id="castling-bk" checked class="accent-emerald-600 rounded"> O-O</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-slate-900"><input type="checkbox" id="castling-bq" checked class="accent-emerald-600 rounded"> O-O-O</label>
                            </div>
                        </div>
                    </div>

                    <!-- Start play button -->
                    <button id="btn-start-play" class="w-full btn-green-main font-bold py-2.5 rounded-md shadow-xs text-xs md:text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> Play From Here vs Computer
                    </button>
                </div>

                <!-- Play Mode Panel -->
                <div id="panel-play" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-sliders text-emerald-600"></i> Computer Match Options
                        </h2>
                    </div>

                    <!-- ELO Difficulty Selector -->
                    <div>
                        <label for="elo-select" class="block text-xs font-semibold text-slate-600 mb-1">Select Engine ELO</label>
                        <select id="elo-select" class="w-full bg-slate-50 border border-slate-300 rounded-md p-2 text-xs md:text-sm font-semibold text-emerald-700 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
                            <option value="800">800 ELO - Beginner</option>
                            <option value="1200" selected>1200 ELO - Amateur</option>
                            <option value="1600">1600 ELO - Intermediate</option>
                            <option value="2000">2000 ELO - Master</option>
                            <option value="2400">2400+ ELO - Grandmaster</option>
                        </select>
                    </div>

                    <!-- Player Color Selection -->
                    <div>
                        <label for="player-side" class="block text-xs font-semibold text-slate-600 mb-1">Your Color</label>
                        <select id="player-side" class="w-full bg-slate-50 border border-slate-300 rounded-md p-2 text-xs md:text-sm font-medium text-slate-800 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
                            <option value="auto">Auto (Based on current turn)</option>
                            <option value="w">Play as White</option>
                            <option value="b">Play as Black</option>
                        </select>
                    </div>

                    <!-- In-game Actions -->
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-takeback" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 rounded-md text-xs flex items-center justify-center gap-1.5 transition border border-slate-300">
                            <i class="fa-solid fa-rotate-left text-amber-600"></i> Undo Move
                        </button>
                        <button id="btn-back-setup" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 rounded-md text-xs flex items-center justify-center gap-1.5 transition border border-slate-300">
                            <i class="fa-solid fa-pen-to-square text-emerald-600"></i> Edit Board
                        </button>
                    </div>

                    <!-- Move Notation Log -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Move Log</label>
                        <div id="move-history" class="bg-slate-50 border border-slate-200 rounded-md p-2.5 h-32 overflow-y-auto text-xs font-mono grid grid-cols-2 gap-x-4 gap-y-1">
                            <!-- Moves populating here -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- FEN Import/Export Dialog -->
    <div id="fen-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-white border border-slate-300 rounded-xl shadow-2xl max-w-lg w-full p-5 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-code text-emerald-600"></i> FEN Position String
                </h3>
                <button id="btn-close-fen" class="text-slate-400 hover:text-slate-600 text-base"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="fen-input" rows="3" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-md text-xs font-mono text-emerald-800 focus:ring-1 focus:ring-emerald-500 focus:outline-none"></textarea>
            <div class="flex justify-end gap-2">
                <button id="btn-copy-fen" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-md text-xs border border-slate-300">Copy FEN</button>
                <button id="btn-load-fen" class="btn-green-main font-semibold px-3 py-1.5 rounded-md text-xs shadow-xs">Load Position</button>
            </div>
        </div>
    </div>

    <script>

            'q': `<svg viewBox="0 0 45 45" class="piece-svg w-full h-full"><g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM16 8.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM33 8.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" fill="#000" stroke="#000"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5L22.5 10l-3 14.5L14 11v14L7 14l2 12z" fill="#000" stroke="#000"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5 2.5 2.5 12.5 2.5 10 0 14-1 12.5-2.5 0 0 0-1.5-1.5-2.5C33 31 33 31.5 34 30c1-2 2.5-2 2.5-4" fill="#000" stroke="#000"/><path d="M11.5 30c5.5-3 16.5-3 22 0M11.5 33.5c5.5-3 16.5-3 22 0M11.5 37c5.5 3.5 16.5 3.5 22 0" stroke="#fff"/></g></svg>`,

            'n': `<svg viewBox="0 0 45 45" class="piece-svg w-full h-full"><g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-12-1-2.5-3-1-4.5-3-1.5-2-1.5-2.5-3-2.5s-3 2.5-4 1.5c-1-1-1.5-4.5 0-5.5 1.5-1 6-1 8.5-7.5z" fill="#000" stroke="#000"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.163-1.449-.333-2.5-1-.8-1.5-1-4.5 1-4.5 2 0 1-2 2.5-2 1.5 0 2.5 1 3 1.5s2.5-1.5 2.5-3c0-1.5-1.5-2.5-1.5-2.5" fill="#000" stroke="#000"/><path d="M9.5 25.5A.5.5 0 1 1 9 25a.5.5 0 0 1 .5.5z" fill="#fff"/><path d="M15 15.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0z" fill="#fff"/></g></svg>`,
            'p': `<svg viewBox="0 0 45 45" class="piece-svg w-full h-full"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#000" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        };

        const PIECE_VALUES = { 'p': 100, 'n': 320, 'b': 330, 'r': 500, 'q': 900, 'k': 20000 };

        /* Application Logic State */
        let gameMode = 'setup';
        let chessGame = new Chess();
        let boardState = Array(8).fill(null).map(() => Array(8).fill(null));
        let isFlipped = false;
        let selectedSquare = null;
        let legalMoves = [];
        let activeTool = 'select';
        let pendingPromotion = null;
        let draggedPieceData = null;

        /* Synthesized Web Audio API */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const boardElem = document.getElementById('chessboard');
        const turnSelect = document.getElementById('turn-select');
        const btnSetupMode = document.getElementById('btn-mode-setup');
        const btnPlayMode = document.getElementById('btn-mode-play');
        const btnStartPlay = document.getElementById('btn-start-play');
        const btnBackSetup = document.getElementById('btn-back-setup');
        const statusBanner = document.getElementById('status-banner');
        const statusText = document.getElementById('status-text');
        const engineLoader = document.getElementById('engine-loader');
        const moveHistoryElem = document.getElementById('move-history');

        function setupPaletteInteractions() {
            Object.keys(PIECE_SVGS).forEach(pKey => {
                const btn = document.getElementById(`pal-${pKey}`);
                if (btn) {
                    btn.innerHTML = PIECE_SVGS[pKey];
                    btn.setAttribute('draggable', 'true');

                    btn.addEventListener('dragstart', (e) => {
                        if (gameMode !== 'setup') return;
                        draggedPieceData = { source: 'palette', piece: pKey };
                        e.dataTransfer.setData('text/plain', pKey);
                        e.dataTransfer.effectAllowed = 'copy';
                        playTone(350, 'sine', 0.05);
                    });
                }
            });

            const trashZone = document.getElementById('trash-zone');
            trashZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                trashZone.classList.add('bg-red-100');
            });
            trashZone.addEventListener('dragleave', () => trashZone.classList.remove('bg-red-100'));
            trashZone.addEventListener('drop', (e) => {
                e.preventDefault();
                trashZone.classList.remove('bg-red-100');
                if (draggedPieceData && draggedPieceData.source === 'board') {
                    const [r, c] = getRowColFromSq(draggedPieceData.fromSq);
                    boardState[r][c] = null;
                    playTone(200, 'triangle', 0.1);
                    renderBoard();
                }
                draggedPieceData = null;
            });
        }

        function renderBoard() {
            boardElem.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const row = isFlipped ? 7 - r : r;
                    const col = isFlipped ? 7 - c : c;
                    const sqName = String.fromCharCode(97 + col) + (8 - row);
                    const isLight = (row + col) % 2 === 0;

                    const squareDiv = document.createElement('div');
                    squareDiv.className = `board-square flex items-center justify-center relative ${isLight ? 'sq-light' : 'sq-dark'}`;
                    squareDiv.dataset.square = sqName;
                    squareDiv.dataset.row = row;
                    squareDiv.dataset.col = col;

                    // Rank & File Notation Overlay Labels matching image style
                    if (col === (isFlipped ? 7 : 0)) {
                        const rankLabel = document.createElement('span');
                        rankLabel.className = `absolute top-0.5 left-1 text-[11px] font-semibold pointer-events-none ${isLight ? 'text-slate-500' : 'text-slate-200'}`;
                        rankLabel.innerText = 8 - row;
                        squareDiv.appendChild(rankLabel);
                    }
                    if (row === (isFlipped ? 0 : 7)) {
                        const fileLabel = document.createElement('span');
                        fileLabel.className = `absolute bottom-0.5 right-1 text-[11px] font-semibold pointer-events-none ${isLight ? 'text-slate-500' : 'text-slate-200'}`;
                        fileLabel.innerText = String.fromCharCode(97 + col);
                        squareDiv.appendChild(fileLabel);
                    }

                    if (selectedSquare === sqName) {
                        squareDiv.classList.add('sq-selected');
                    }

                    // Render Piece
                    let piece = null;
                    if (gameMode === 'setup') {
                        piece = boardState[row][col];
                    } else {
                        const p = chessGame.get(sqName);
                        if (p) piece = p.color === 'w' ? p.type.toUpperCase() : p.type.toLowerCase();
                    }

                    if (piece && PIECE_SVGS[piece]) {
                        const pieceWrapper = document.createElement('div');
                        pieceWrapper.className = 'w-[88%] h-[88%] flex items-center justify-center';
                        pieceWrapper.innerHTML = PIECE_SVGS[piece];
                        
                        if (gameMode === 'setup' || (gameMode === 'play' && chessGame.get(sqName)?.color === chessGame.turn())) {
                            pieceWrapper.setAttribute('draggable', 'true');
                            pieceWrapper.addEventListener('dragstart', (e) => {
                                if (gameMode === 'setup') {
                                    draggedPieceData = { source: 'board', piece: piece, fromSq: sqName };
                                } else {
                                    selectedSquare = sqName;
                                    legalMoves = chessGame.moves({ square: sqName, verbose: true });
                                    draggedPieceData = { source: 'play', piece: piece, fromSq: sqName };
                                }
                                e.dataTransfer.setData('text/plain', sqName);
                                playTone(400, 'sine', 0.05);
                            });
                        }
                        squareDiv.appendChild(pieceWrapper);
                    }

                    // Render Move Hints
                    if (gameMode === 'play') {
                        const targetMove = legalMoves.find(m => m.to === sqName);
                        if (targetMove) {
                            const hint = document.createElement('div');
                            hint.className = targetMove.captured ? 'legal-capture' : 'legal-dot';
                            squareDiv.appendChild(hint);
                        }
                    }

                    // HTML5 Drag and Drop Handlers
                    squareDiv.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        squareDiv.classList.add('sq-drag-over');
                    });

                    squareDiv.addEventListener('dragleave', () => {
                        squareDiv.classList.remove('sq-drag-over');
                    });

                    squareDiv.addEventListener('drop', (e) => {
                        e.preventDefault();
                        squareDiv.classList.remove('sq-drag-over');
                        handleDropOnSquare(row, col, sqName);
                    });

                    // Square Click
                    squareDiv.addEventListener('click', () => handleSquareClick(row, col, sqName));

                    // Right Click Quick Delete
                    squareDiv.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        if (gameMode === 'setup') {
                            boardState[row][col] = null;
                            selectedSquare = null;
                            playTone(220, 'triangle', 0.08);
                            renderBoard();
                        }
                    });

                    boardElem.appendChild(squareDiv);
                }
            }
        }

        function handleDropOnSquare(toRow, toCol, toSq) {
            if (!draggedPieceData) return;

            if (gameMode === 'setup') {
                if (draggedPieceData.source === 'palette') {
                    boardState[toRow][toCol] = draggedPieceData.piece;
                    playTone(520, 'sine', 0.08);
                } else if (draggedPieceData.source === 'board') {
                    const [fromR, fromC] = getRowColFromSq(draggedPieceData.fromSq);
                    boardState[toRow][toCol] = boardState[fromR][fromC];
                    if (draggedPieceData.fromSq !== toSq) {
                        boardState[fromR][fromC] = null;
                    }
                    playTone(480, 'sine', 0.08);
                }
                selectedSquare = null;
                renderBoard();
            } else if (gameMode === 'play') {
                const move = legalMoves.find(m => m.to === toSq);
                if (move) {
                    if (move.flags.includes('p')) {
                        pendingPromotion = { from: draggedPieceData.fromSq, to: toSq };
                        showPromotionModal(chessGame.turn());
                        return;
                    }
                    executeMove({ from: draggedPieceData.fromSq, to: toSq });
                    selectedSquare = null;
                    legalMoves = [];
                    renderBoard();
                    checkEngineTurn();
                }
            }
            draggedPieceData = null;
        }

        function handleSquareClick(row, col, sqName) {
            if (gameMode === 'setup') {
                if (activeTool === 'select') {
                    if (selectedSquare === sqName) {
                        selectedSquare = null;
                    } else if (selectedSquare) {
                        const [prevR, prevC] = getRowColFromSq(selectedSquare);
                        boardState[row][col] = boardState[prevR][prevC];
                        boardState[prevR][prevC] = null;
                        selectedSquare = null;
                        playTone(320, 'sine', 0.08);
                    } else if (boardState[row][col]) {
                        selectedSquare = sqName;
                    }
                } else if (activeTool === 'trash') {
                    boardState[row][col] = null;
                    playTone(200, 'triangle', 0.08);
                } else {
                    boardState[row][col] = activeTool;
                    playTone(440, 'sine', 0.08);
                }
                renderBoard();
            } else if (gameMode === 'play') {
                if (chessGame.game_over()) return;

                const sideToPlay = chessGame.turn();
                const playerSide = document.getElementById('player-side').value;

                if (playerSide !== 'auto' && sideToPlay !== playerSide) return;

                if (selectedSquare) {
                    const move = legalMoves.find(m => m.to === sqName);
                    if (move) {
                        if (move.flags.includes('p')) {
                            pendingPromotion = { from: selectedSquare, to: sqName };
                            showPromotionModal(sideToPlay);
                            return;
                        }
                        executeMove({ from: selectedSquare, to: sqName });
                        selectedSquare = null;
                        legalMoves = [];
                        renderBoard();
                        checkEngineTurn();
                        return;
                    }
                }

                const piece = chessGame.get(sqName);
                if (piece && piece.color === sideToPlay) {
                    selectedSquare = sqName;
                    legalMoves = chessGame.moves({ square: sqName, verbose: true });
                } else {
                    selectedSquare = null;
                    legalMoves = [];
                }
                renderBoard();
            }
        }

        function getRowColFromSq(sq) {
            const col = sq.charCodeAt(0) - 97;
            const row = 8 - parseInt(sq[1]);
            return [row, col];
        }

        function buildFenFromSetup() {
            let fenRows = [];
            for (let r = 0; r < 8; r++) {
                let emptyCount = 0;
                let rowStr = '';
                for (let c = 0; c < 8; c++) {
                    const piece = boardState[r][c];
                    if (!piece) {
                        emptyCount++;
                    } else {
                        if (emptyCount > 0) {
                            rowStr += emptyCount;
                            emptyCount = 0;
                        }
                        rowStr += piece;
                    }
                }
                if (emptyCount > 0) rowStr += emptyCount;
                fenRows.push(rowStr);
            }

            const turn = turnSelect.value;
            let castling = '';
            if (document.getElementById('castling-wk').checked) castling += 'K';
            if (document.getElementById('castling-wq').checked) castling += 'Q';
            if (document.getElementById('castling-bk').checked) castling += 'k';
            if (document.getElementById('castling-bq').checked) castling += 'q';
            if (!castling) castling = '-';

            return `${fenRows.join('/')} ${turn} ${castling} - 0 1`;
        }

        function loadFenToSetup(fen) {
            const valid = chessGame.load(fen);
            if (!valid) return false;

            boardState = Array(8).fill(null).map(() => Array(8).fill(null));
            const parts = fen.split(' ');
            const rows = parts[0].split('/');

            for (let r = 0; r < 8; r++) {
                let col = 0;
                for (let char of rows[r]) {
                    if (!isNaN(char)) {
                        col += parseInt(char);
                    } else {
                        boardState[r][col] = char;
                        col++;
                    }
                }
            }

            turnSelect.value = parts[1] || 'w';
            const castling = parts[2] || '';
            document.getElementById('castling-wk').checked = castling.includes('K');
            document.getElementById('castling-wq').checked = castling.includes('Q');
            document.getElementById('castling-bk').checked = castling.includes('k');
            document.getElementById('castling-bq').checked = castling.includes('q');

            renderBoard();
            return true;
        }

        function showPromotionModal(color) {
            const modal = document.getElementById('promotion-modal');
            const optionsContainer = document.getElementById('promotion-options');
            optionsContainer.innerHTML = '';

            const pieces = color === 'w' ? ['Q', 'R', 'B', 'N'] : ['q', 'r', 'b', 'n'];
            pieces.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'p-2 bg-slate-50 hover:bg-emerald-50 border border-slate-300 hover:border-emerald-500 rounded-lg transition w-14 h-14 flex items-center justify-center';
                btn.innerHTML = PIECE_SVGS[p];
                btn.onclick = () => {
                    executeMove({
                        from: pendingPromotion.from,
                        to: pendingPromotion.to,
                        promotion: p.toLowerCase()
                    });
                    modal.classList.add('hidden');
                    pendingPromotion = null;
                    selectedSquare = null;
                    legalMoves = [];
                    renderBoard();
                    checkEngineTurn();
                };
                optionsContainer.appendChild(btn);
            });
            modal.classList.remove('hidden');
        }

        function executeMove(moveObj) {
            const result = chessGame.move(moveObj);
            if (result) {
                if (result.captured) playTone(580, 'square', 0.12);
                else playTone(480, 'sine', 0.08);

                updateMoveLog();
                updateStatusBanner();
            }
        }

        function updateMoveLog() {
            moveHistoryElem.innerHTML = '';
            const history = chessGame.history({ verbose: true });
            for (let i = 0; i < history.length; i += 2) {
                const moveNum = Math.floor(i / 2) + 1;
                const whiteMove = history[i] ? history[i].san : '';
                const blackMove = history[i + 1] ? history[i + 1].san : '';
                
                const entry = document.createElement('div');
                entry.className = 'flex justify-between border-b border-slate-200 py-0.5 px-1';
                entry.innerHTML = `<span class="text-slate-400">${moveNum}.</span><span class="font-semibold text-slate-800">${whiteMove}</span><span class="text-slate-600">${blackMove}</span>`;
                moveHistoryElem.appendChild(entry);
            }
            moveHistoryElem.scrollTop = moveHistoryElem.scrollHeight;
        }

        function updateStatusBanner() {
            statusBanner.className = 'mb-4 p-3 rounded-lg border text-xs md:text-sm font-semibold flex items-center justify-between transition-all duration-200 shadow-xs ';
            
            if (chessGame.in_checkmate()) {
                const winner = chessGame.turn() === 'w' ? 'Black' : 'White';
                statusText.innerText = `Checkmate! ${winner} wins!`;
                statusBanner.classList.add('bg-emerald-50', 'text-emerald-900', 'border-emerald-300');
                playTone(600, 'triangle', 0.3);
            } else if (chessGame.in_draw() || chessGame.in_stalemate()) {
                statusText.innerText = `Draw / Stalemate position reached.`;
                statusBanner.classList.add('bg-amber-50', 'text-amber-900', 'border-amber-300');
            } else {
                const turnStr = chessGame.turn() === 'w' ? 'White to move' : 'Black to move';
                const inCheck = chessGame.in_check() ? ' — IN CHECK!' : '';
                statusText.innerText = `${turnStr}${inCheck}`;
                statusBanner.classList.add('bg-white', 'text-slate-800', 'border-slate-300');
                if (chessGame.in_check()) playTone(280, 'sawtooth', 0.15);
            }
        }

        function checkEngineTurn() {
            if (chessGame.game_over()) return;

            const sideToPlay = chessGame.turn();
            const playerSide = document.getElementById('player-side').value;

            let isEngineTurn = false;
            if (playerSide === 'w' && sideToPlay === 'b') isEngineTurn = true;
            if (playerSide === 'b' && sideToPlay === 'w') isEngineTurn = true;
            if (playerSide === 'auto' && sideToPlay !== turnSelect.value) isEngineTurn = true;

            if (isEngineTurn) {
                engineLoader.classList.remove('hidden');
                setTimeout(makeEngineMove, 250);
            }
        }

        function makeEngineMove() {
            const elo = parseInt(document.getElementById('elo-select').value);
            const moves = chessGame.moves({ verbose: true });
            if (moves.length === 0) return;

            let chosenMove = null;

            if (elo <= 800) {
                const captures = moves.filter(m => m.captured);
                if (captures.length > 0 && Math.random() < 0.45) {
                    chosenMove = captures[Math.floor(Math.random() * captures.length)];
                } else {
                    chosenMove = moves[Math.floor(Math.random() * moves.length)];
                }
            } else {
                const depth = elo >= 2000 ? 3 : (elo >= 1600 ? 2 : 1);
                let bestVal = -Infinity;
                let bestMoves = [];

                for (let move of moves) {
                    chessGame.move(move);
                    let val = -minimax(depth - 1, -100000, 100000, false);
                    chessGame.undo();

                    if (elo < 2000) val += (Math.random() * (2000 - elo) / 10 - (2000 - elo) / 20);

                    if (val > bestVal) {
                        bestVal = val;
                        bestMoves = [move];
                    } else if (val === bestVal) {
                        bestMoves.push(move);
                    }
                }
                chosenMove = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }

            engineLoader.classList.add('hidden');
            executeMove(chosenMove);
            renderBoard();
        }

        function minimax(depth, alpha, beta, isMaximizing) {
            if (depth === 0 || chessGame.game_over()) {
                return evaluatePosition();
            }

            const moves = chessGame.moves({ verbose: true });
            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    chessGame.move(move);
                    let evalVal = minimax(depth - 1, alpha, beta, false);
                    chessGame.undo();
                    maxEval = Math.max(maxEval, evalVal);
                    alpha = Math.max(alpha, evalVal);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    chessGame.move(move);
                    let evalVal = minimax(depth - 1, alpha, beta, true);
                    chessGame.undo();
                    minEval = Math.min(minEval, evalVal);
                    beta = Math.min(beta, evalVal);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluatePosition() {
            let total = 0;
            const board = chessGame.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p) {
                        const val = PIECE_VALUES[p.type] || 0;
                        if (p.color === chessGame.turn()) total += val;
                        else total -= val;
                    }
                }
            }
            return total;
        }

        document.querySelectorAll('.palette-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (btn.dataset.tool) {
                    activeTool = btn.dataset.tool;
                } else if (btn.dataset.piece) {
                    activeTool = btn.dataset.piece;
                }
                selectedSquare = null;
            });
        });

        function switchToSetupMode() {
            gameMode = 'setup';
            btnSetupMode.className = "btn-green-main btn-green-active px-3.5 py-1.5 rounded-md font-semibold text-xs md:text-sm flex items-center gap-2 shadow-sm";
            btnPlayMode.className = "btn-green-main px-3.5 py-1.5 rounded-md font-semibold text-xs md:text-sm flex items-center gap-2 shadow-sm";
            document.getElementById('panel-setup').classList.remove('hidden');
            document.getElementById('panel-play').classList.add('hidden');
            statusBanner.className = 'mb-4 p-3 rounded-lg border text-xs md:text-sm font-semibold flex items-center justify-between transition-all duration-200 bg-white border-slate-300 text-slate-800 shadow-xs';
            statusText.innerText = "Analysis Mode: Drag or click pieces from the palette onto any square.";
            selectedSquare = null;
            renderBoard();
        }

        function validateBoardPosition() {
            let whiteKings = 0;
            let blackKings = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (boardState[r][c] === 'K') whiteKings++;
                    if (boardState[r][c] === 'k') blackKings++;
                }
            }

            if (whiteKings !== 1 || blackKings !== 1) {
                statusBanner.className = 'mb-4 p-3 rounded-lg border text-xs md:text-sm font-semibold flex items-center justify-between transition-all duration-200 bg-red-50 text-red-900 border-red-300 shadow-xs';
                statusText.innerText = `Invalid Setup: Exactly 1 White King and 1 Black King required (Found ${whiteKings} White, ${blackKings} Black).`;
                playTone(180, 'sawtooth', 0.2);
                return false;
            }
            return true;
        }

        function switchToPlayMode() {
            if (!validateBoardPosition()) return;

            const fen = buildFenFromSetup();
            const valid = chessGame.load(fen);
            if (!valid) {
                statusBanner.className = 'mb-4 p-3 rounded-lg border text-xs md:text-sm font-semibold flex items-center justify-between transition-all duration-200 bg-red-50 text-red-900 border-red-300 shadow-xs';
                statusText.innerText = "Invalid FEN Position! Check king safety or pawn placements on ranks 1 & 8.";
                playTone(180, 'sawtooth', 0.2);
                return;
            }

            gameMode = 'play';
            btnPlayMode.className = "btn-green-main btn-green-active px-3.5 py-1.5 rounded-md font-semibold text-xs md:text-sm flex items-center gap-2 shadow-sm";
            btnSetupMode.className = "btn-green-main px-3.5 py-1.5 rounded-md font-semibold text-xs md:text-sm flex items-center gap-2 shadow-sm";
            document.getElementById('panel-setup').classList.add('hidden');
            document.getElementById('panel-play').classList.remove('hidden');
            selectedSquare = null;
            legalMoves = [];
            
            updateMoveLog();
            updateStatusBanner();
            renderBoard();
            checkEngineTurn();
        }

        btnSetupMode.addEventListener('click', switchToSetupMode);
        btnPlayMode.addEventListener('click', switchToPlayMode);
        btnStartPlay.addEventListener('click', switchToPlayMode);
        btnBackSetup.addEventListener('click', switchToSetupMode);

        document.getElementById('btn-clear').addEventListener('click', () => {
            boardState = Array(8).fill(null).map(() => Array(8).fill(null));
            selectedSquare = null;
            renderBoard();
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            loadFenToSetup("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
        });

        document.getElementById('btn-flip').addEventListener('click', () => {
            isFlipped = !isFlipped;
            renderBoard();
        });

        document.getElementById('btn-takeback').addEventListener('click', () => {
            if (gameMode === 'play') {
                chessGame.undo();
                chessGame.undo();
                selectedSquare = null;
                legalMoves = [];
                updateMoveLog();
                updateStatusBanner();
                renderBoard();
            }
        });

        const fenModal = document.getElementById('fen-modal');
        document.getElementById('btn-import-fen').addEventListener('click', () => {
            document.getElementById('fen-input').value = gameMode === 'setup' ? buildFenFromSetup() : chessGame.fen();
            fenModal.classList.remove('hidden');
        });
        document.getElementById('btn-close-fen').addEventListener('click', () => fenModal.classList.add('hidden'));
        document.getElementById('btn-copy-fen').addEventListener('click', () => {
            const copyText = document.getElementById('fen-input');
            copyText.select();
            document.execCommand('copy');
        });
        document.getElementById('btn-load-fen').addEventListener('click', () => {
            const fenVal = document.getElementById('fen-input').value.trim();
            if (loadFenToSetup(fenVal)) {
                fenModal.classList.add('hidden');
            }
        });

        window.onload = function() {
            setupPaletteInteractions();
            loadFenToSetup("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
        };
    </script>
</body>
</html>
